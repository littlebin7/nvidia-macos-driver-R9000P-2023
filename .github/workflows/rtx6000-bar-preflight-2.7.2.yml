name: NullMoth 2.7.2 + preflight BAR placement (full)
on:
  workflow_dispatch:
  push:
    branches: [preflight-272]
permissions:
  contents: read
concurrency:
  group: preflight-272-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Select matching Intel macOS toolchain
        run: |
          test "$(uname -m)" = x86_64
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          command -v gmake || brew install make
      - name: Fetch pinned NVIDIA source and matching official patches
        run: |
          git clone --depth 1 --branch 615.78.08 https://github.com/NVIDIA/open-gpu-kernel-modules.git .deps/open-gpu-kernel-modules
          test "$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)" = 1a82fbfda8f321b056eb3568850f9316c5e465c5
          git -C .deps/open-gpu-kernel-modules apply ../../ci/patches/610-macos-version-headers.patch
          git -C .deps/open-gpu-kernel-modules apply ../../ci/patches/615-display-completion.patch
          git -C .deps/open-gpu-kernel-modules apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-setmode-reason.patch
          git -C .deps/open-gpu-kernel-modules apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-backlight-register-log.patch
          git -C .deps/open-gpu-kernel-modules apply --recount --directory=src/nvidia-modeset ../../kexts/NVRM/patches/615-viewport-scaling.patch
      - name: Build and link the native Intel kexts
        run: python3 ci/build-macos-kexts.py --vendor .deps/open-gpu-kernel-modules --output build-out --jobs 4
      - name: Package with the checksum-pinned official 2.7.2 driver
        run: python3 ci/package-experiment.py --output build-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nullmoth-2.7.2-preflight-${{ github.run_number }}
          path: |
            build-out/logs/
            build-out/build-proof.json
            build-out/SHA256SUMS.txt
            build-out/nullmoth-2.7.2-rtx6000-bar-preflight-v2.tar.gz
          if-no-files-found: warn
          retention-days: 14
